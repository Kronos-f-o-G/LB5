{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Грузовые перевозки</title>
    <link rel="stylesheet" href="{% static 'css/article.css' %}">
</head>
<body class="archive">
    <div class="header">
        <!-- Логотип по центру (если файл image.png лежит в static/) -->
        <img src="{% static 'image.png' %}" alt="Django public blog">
    </div>
     <p><a href="{% url 'create_post' %}" style="color: white; font-size: 18px; font-weight: bold;">+ Создать перевозку</a></p>
    <div class="archive">
        {% for post in posts %}
        <div class="one-post">
            <h2 class="post-title">
                <a href="{% url 'get_article' article_id=post.id %}">{{ post.title }}</a>
            </h2>
            <div class="article-info">
                <div class="article-author">{{ post.author.username }}</div>
                <div class="article-created-date">{{ post.created_date }}</div>
            </div>
            <p class="article-text">{{ post.get_excerpt }}</p>
        </div>
        {% endfor %}
    </div>
</body>
</html>
